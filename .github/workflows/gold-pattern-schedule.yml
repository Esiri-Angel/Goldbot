name: Gold pattern bot

# Checks gold every 30 minutes and only messages Telegram when a signal
# actually changes (new one appears, or an old one disappears) -- not on
# every single run. That "only alert on change" behavior is what makes
# this safe to run this often without spamming you all day.
#
# HOW THE "ONLY ON CHANGE" PART WORKS ACROSS SEPARATE RUNS:
# Each GitHub Actions run is a brand new, stateless process -- it has no
# memory of the last run. gold_pattern_scheduled.py works around this by
# saving what it saw to state/gold_pattern_state.json, and the last step
# below commits that file back to the repo. The NEXT run reads that file
# back in, so the comparison survives even though the process itself
# doesn't. This was tested directly across two genuinely separate
# process runs before shipping, not assumed to work.
#
# MINUTES BUDGET: every 30 min = 48 runs/day. Each run checks one pair
# across 4 timeframes (much lighter than Model B's 12-pair scan), so
# this comfortably stays inside GitHub's free 2,000 min/month for a
# private repo. Every 15 min would roughly double that and get close to
# the cap -- 30 min is the safer default.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

# Needed so this workflow can commit the updated state file back to the repo
permissions:
  contents: write

jobs:
  gold_pattern_check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run gold pattern check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python gold_pattern_scheduled.py

      - name: Commit updated state
        run: |
          git config user.name "gold-pattern-bot"
          git config user.email "actions@github.com"
          git add state/gold_pattern_state.json
          git diff --staged --quiet && echo "No state change to commit" || git commit -m "Update gold pattern state [skip ci]"
          git push
